<style>

    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1a1e29; --surface2:#222736; --ink:#e7e9f0; --ink2:#b3b9c9; --ink3:#868da1;
  --line:#2c3243; --line2:#3a4256; --accent:#a78bfa; --accent-soft:#2a2346;
  --verde:#4ade80; --verde-bg:#13301f; --amar:#facc15; --amar-bg:#332a0c; --rojo:#f87171; --rojo-bg:#3a1618;
  --sin:#8fb4f0; --sin-bg:#1b2a44; --fuera:#a3aab9; --fuera-bg:#272c38; --reg:#5eead4; --reg-bg:#0f3330;
  --cie:#12151d; --cie-bg:#d5d9e3; --cap:#c4b5fd; --cap-bg:#2b2147; --bg-gen:#fdba74; --bg-gen-bg:#3a2210;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--stickH,120px) + var(--rstickH,0px) + 8px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1680px;margin:0 auto;padding:0 20px}

/* barra superior */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:18px;padding-bottom:14px;flex-wrap:wrap}
.brand h1{margin:0;font-size:22px;letter-spacing:-.01em;font-weight:750}
.brand p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.natl{display:flex;gap:22px;flex-wrap:wrap}
.natl div{min-width:70px}
.natl b{display:block;font-size:18px;font-variant-numeric:tabular-nums;font-weight:700}
.natl span{font-size:12px;color:var(--ink3)}

/* pestañas de región */
.stick{position:sticky;top:0;z-index:6}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.srcbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:6px}
.srcbar .src b{color:var(--ink2);font-weight:650}
.srcbar .src.live b{color:var(--verde)}
.srcbar .lnk{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2)}
.srcbar .lnk:hover{background:var(--surface2);color:var(--ink)}
.warn{background:var(--amar-bg);color:var(--amar);border:1px solid var(--amar);border-radius:8px;padding:8px 12px;font-size:12.5px;margin:12px 0 0}
.warn b{font-weight:700}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:12px 14px 11px;cursor:pointer;color:var(--ink2);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
.tab small{font-weight:500;color:var(--ink3);margin-left:6px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

/* región */
.region{display:none;padding:0 0 48px}
.rstick{position:sticky;top:var(--stickH,0px);z-index:4;background:var(--bg);padding:14px 0 12px;margin-bottom:6px}
.rstick .legend{margin-bottom:0}
.region.on{display:block}
.rhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end;margin-bottom:10px}
.rhead h2{margin:0;font-size:30px;line-height:1.05;letter-spacing:-.02em;font-weight:800}
.rhead .dir{color:var(--ink2);margin-top:4px}
.rkpi{display:flex;gap:26px;flex-wrap:wrap;justify-content:flex-end}
.rkpi div b{display:block;font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
.rkpi div span{font-size:12px;color:var(--ink3)}

/* leyenda / filtros rápidos */
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.legend .lbl{font-size:12px;color:var(--ink3);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.chip .n{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chip.clear{border-style:dashed}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* bloque regional */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start}
.gr{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.grh{padding:12px 12px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:start}
.gr.open .grh{border-bottom:1px solid var(--line)}
.grh > *:not(.tog):not(.perf){grid-column:1}
.perf{grid-column:2;grid-row:1;justify-self:end;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.p-buena{color:var(--verde);background:var(--verde-bg)}
.p-prom{color:var(--amar);background:var(--amar-bg)}
.p-crit{color:var(--bg-gen);background:var(--bg-gen-bg)}
.grh h3{cursor:pointer}
.tog{grid-column:2;grid-row:2 / span 3;align-self:center;justify-self:end;margin-top:6px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
.tog:hover{background:var(--surface2);color:var(--ink)}
.tog svg{width:14px;height:14px;transition:transform .18s ease}
.gr.open .tog svg{transform:rotate(90deg)}
.gr .cnt{font-size:11.5px;color:var(--accent);font-weight:650;margin-top:6px}
.lgacts{display:flex;gap:6px;margin-left:auto}
.grh h3{margin:0;font-size:15.5px;line-height:1.25;font-weight:750;letter-spacing:-.005em}
.grh .sub{font-size:12px;color:var(--ink3);margin-top:2px}
.grk{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.grk b{font-size:14px;color:var(--ink);font-weight:700;margin-right:2px}
.grk b.hi{color:var(--verde)} .grk b.lo{color:var(--rojo)}
.focus{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.focus .ok{font-size:12px;color:var(--verde)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;table-layout:fixed}
col.c-t{width:auto} col.c-n{width:50px} col.c-tc{width:54px} col.c-h{width:50px}
th{text-align:left;font-weight:650;font-size:11.5px;color:var(--ink2);background:var(--surface2);padding:7px 5px 5px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;overflow:hidden;text-overflow:clip}
th:first-child{padding-left:10px}
th.s{cursor:pointer}
th.s:hover{color:var(--ink)}
th .ar{color:var(--ink3);font-size:8px;margin-left:1px;vertical-align:1px}
th.num,td.num{text-align:right}
tr.flt th{background:var(--surface2);padding:0 3px 7px;font-weight:400;overflow:visible}
tr.flt th:first-child{padding-left:8px}
tr.flt input,tr.flt select{width:100%;min-width:0;padding:3px 4px;border:1px solid var(--line2);border-radius:5px;background:var(--surface);font-size:11.5px}
tr.flt .two{display:flex;gap:4px}
tr.flt .two input{flex:1 1 55%} tr.flt .two select{flex:1 1 45%}
tr.flt th.num input{text-align:right}
td{padding:6px 5px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
td:first-child{padding-left:10px}
td.num{padding-top:7px}
tbody tr:last-child td{border-bottom:0}
tbody tr{box-shadow:inset 3px 0 0 var(--rowc,transparent)}
tbody tr:hover td{background:var(--surface2)}
td.tn b{font-weight:600;display:block;line-height:1.25;overflow-wrap:anywhere}
td.tn .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
td.tn small.ck{color:var(--ink3);font-size:10.5px}
td.tn small.sel{display:block;color:var(--ink3);font-size:10.5px;line-height:1.3;margin-top:1px;overflow-wrap:anywhere}
td.tn .tags{margin-top:3px;line-height:1.2}
tr.cie td{color:var(--ink3)}
tr.cie td.tn b{text-decoration:line-through;text-decoration-thickness:1px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;white-space:nowrap}
.tag{display:inline-block;padding:0 5px;border-radius:4px;font-size:10.5px;font-weight:600;margin:1px 3px 1px 0;white-space:nowrap;line-height:1.55}
.t-camp{background:var(--accent-soft);color:var(--accent)}
.t-sin{background:var(--sin-bg);color:var(--sin)}
.t-reg{background:var(--reg-bg);color:var(--reg)}
.t-fuera{background:var(--fuera-bg);color:var(--fuera)}
.t-cie{background:var(--cie-bg);color:var(--cie)}
.t-cap{background:var(--cap-bg);color:var(--cap)}
.t-bg{background:var(--bg-gen-bg);color:var(--bg-gen)}
.t-sale{background:var(--rojo);color:#fff}
.t-rv{background:transparent;color:var(--amar);border:1px dashed var(--amar)}
.chip.zero{opacity:.55}
.lo{color:var(--rojo);font-weight:650}
.hi{color:var(--verde);font-weight:650}
.hist{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.hist i{font-style:normal;display:block;width:40px;text-align:center;padding:0 2px;border-radius:3px;font-size:10.5px;line-height:1.5;background:var(--surface2);color:var(--ink3)}
.hist i.up{background:var(--verde-bg);color:var(--verde)}
.hist i.dn{background:var(--rojo-bg);color:var(--rojo)}
.hist i.ov{outline:1px dashed currentColor;outline-offset:-1px}
.empty{padding:14px 16px;color:var(--ink3);font-size:13px}

/* retro */
.retro{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:26px;box-shadow:var(--shadow)}
.retro h3{margin:0 0 2px;font-size:17px}
.retro .hint{margin:0 0 12px;color:var(--ink3);font-size:12.5px}
.rform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.rform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.rform select,.rform input,.rform textarea{padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:13.5px}
.rform textarea{grid-column:1/-1;min-height:96px;resize:vertical;line-height:1.45}
.ract{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#12151d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#12151d}}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.store{font-size:12px;color:var(--ink3);margin-left:auto}
.store b{color:var(--ink2)}
.msg{font-size:12.5px}
.msg.ok{color:var(--verde)} .msg.err{color:var(--rojo)}
.rlist{margin-top:14px;border-top:1px solid var(--line)}
.ritem{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.ritem .who{font-size:12px;color:var(--ink3)}
.ritem .who b{color:var(--ink2);font-weight:650}
.ritem .txt{grid-column:1/-1;white-space:pre-wrap;word-wrap:break-word}
.ritem .del{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:12px}
.ritem .del:hover{color:var(--rojo)}

/* cómo leer */
details.read{margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.read summary{cursor:pointer;font-weight:650;color:var(--ink2)}
details.read p{margin:8px 0 0;color:var(--ink2);font-size:13px;max-width:96ch}
.foot{color:var(--ink3);font-size:12px;padding:0 0 32px}

@media (max-width:760px){
  .stick{top:calc(-1 * var(--topH,0px))}
  .rstick{position:static}
  .rhead{grid-template-columns:1fr}
  .rkpi{justify-content:flex-start}
  .rhead h2{font-size:28px}
  .grid{grid-template-columns:1fr}
  .rform{grid-template-columns:1fr}
}
@media print{
  .tw[hidden]{display:block!important}
  .tog,.lgacts{display:none!important}
  .tabs,.legend,tr.flt,.ract,.rform,details.read,.top .natl,.srcbar .lnk,.warn{display:none!important}
  .stick,.rstick{position:static!important}
  body{background:#fff}
  .gr,.retro{box-shadow:none;break-inside:avoid}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .region:not(.on){display:none!important}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

  [mes].concat(prev).forEach(function(m){ try{ tot[m] = totals(grab(h,'DATA_'+MES3[m])); }catch(e){} });
  if(!tot[mes]) throw new Error('no se encontró DATA_'+MES3[mes]);
  var big = null;
  Rk.rows.forEach(function(r){ if(r.leads_dia>0 && r.leads>(big?big.leads:0)) big = r; });
  var rows = Rk.rows.map(function(r){
    return {k:r.clave, sem:r.semaforo, bg:!!r.baja_generacion, cap:!!r.capacitacion_obligatoria, mbp:r.meses_bajo_promedio, camp:r.campania, s:String(r.seleccion||'').trim(), l:r.leads, v:r.ventas,
      h: prev.map(function(m){ var e = (r.historial||[]).filter(function(x){return x.mes===m;})[0]; return e ? [e.leads, e.ventas] : [0,0]; })};
  });
  var mst = {};
  Object.keys(master).forEach(function(k){ var x = master[k]; mst[k] = [x.tienda, x.region, x.regional, x.director]; });
  return {v:1, mes:mes, dias: big ? Math.round(big.leads/big.leads_dia) : null, prev:prev, tcn:Rk.tc_nacional, tcnh:Rk.tc_nacional_historico, riesgo:rows, master:mst, tot:tot};
}
function srcRank(x){ return x ? (MES_N.indexOf(x.mes)+1)*100 + (x.dias||0) : -1; }
function srcLabel(x){ var dd=('0'+(x.dias||'')).slice(-2); return cap1(x.mes)+' corte '+(x.dias||'?')+' (01–'+dd+' '+x.mes.slice(0,3)+' '+BASE.year+')'; }
function validSrc(x){ return x && x.v===1 && MES3[x.mes] && x.master && x.riesgo && x.tot && x.tot[x.mes] && Array.isArray(x.prev); }

/* ---------- reglas del tablero (las mismas del pipeline en Python) ---------- */
function buildData(src, rosters){
  var warn = [], Rm = {}, cur = src.tot[src.mes] || {}, prev = src.prev, mi = MES_N.indexOf(src.mes)+1;
  src.riesgo.forEach(function(r){ Rm[r.k] = r; });
  var nl=0, nv=0; src.riesgo.forEach(function(r){ r.h.forEach(function(x){ nl+=x[0]; nv+=x[1]; }); });
  var tcnAcum = nl ? r1(nv/nl*100) : null;
  prev.forEach(function(m,i){ var l=0,v=0; src.riesgo.forEach(function(r){ l+=r.h[i][0]; v+=r.h[i][1]; }); if(l && r1(v/l*100)!==src.tcnh[m]) warn.push('El TC nacional de '+m+' ('+src.tcnh[m]+'%) no cuadra con el historial del semáforo ('+r1(v/l*100)+'%).'); });
  // meses en campaña: concentrado + roster de cada corte ya cargado + roster actual
  var memb = {};
  Object.keys(BASE.camp).forEach(function(k){ memb[k] = BASE.camp[k].filter(function(x){ return x<=mi; }); });
  function addM(k, m){ var a = memb[k] || (memb[k]=[]); if(a.indexOf(m)<0) a.push(m); }
  Object.keys(rosters||{}).forEach(function(m){ var x = MES_N.indexOf(m)+1; if(x>0 && x<=mi) (rosters[m]||[]).forEach(function(k){ addM(k,x); }); });
  src.riesgo.forEach(function(r){ addM(r.k, mi); });
  var fueraMaster = src.riesgo.filter(function(r){ return !src.master[r.k]; }).map(function(r){ return r.k; });
  if(fueraMaster.length) warn.push(fueraMaster.length+' tiendas del semáforo no están en la estructura: '+fueraMaster.join(', ')+'.');
  var difLV = [];
  var rows = Object.keys(src.master).map(function(k){
    var m = src.master[k], r = Rm[k], lv = cur[k] || [0,0];
    if(r && (r.l!==lv[0] || r.v!==lv[1])) difLV.push(k);
    var h = prev.map(function(mn,i){
      if(r) return r.h[i].slice();
      var hc = BASE.hist_cerrado[mn]; if(hc) return hc[k] ? hc[k].slice() : [0,0];
      var t = src.tot[mn]; return t && t[k] ? t[k].slice() : [0,0];
    });
    var meses = (memb[k] || []).slice().sort(function(a,b){return a-b;});
    var st = r ? 'campania' : (meses.length ? 'fuera' : 'sin2026');
    var hl = 0, hv = 0; h.forEach(function(x){ hl+=x[0]; hv+=x[1]; });
    var tch = hl ? r1(hv/hl*100) : null;
    var reg = st==='fuera' && tch!=null && tch>tcnAcum && hl>=BASE.min_leads_regreso;
    var capV = 0; h.forEach(function(x){ capV += Math.min(x[0], x[1]); });
    var rv = reg && h.some(function(x){ return x[0] && x[1]>x[0]; }) && !(hl && capV/hl*100 > tcnAcum);
    var sel = (r && r.s) || (BASE.sel && BASE.sel[k]) || '';
    return { k:k, t:m[0], sel:sel, rg:m[1], gr:m[2], dr:m[3], l:lv[0], v:lv[1], tc: lv[0] ? r1(lv[1]/lv[0]*100) : 0,
      st:st, sem: r ? r.sem : null, bg: r ? r.bg : false, cap: r ? r.cap : false, mbp: r ? r.mbp : null,
      sale: !!(r && r.sem==='rojo' && r.mbp===3), camp: r ? r.camp : null, h:h, tch:tch, hl:hl,
      um: meses.length ? cap1(MES_N[meses[meses.length-1]-1]) : null, nm: meses.length, reg:reg, rv:rv, cie: BASE.cierres.indexOf(k)>=0 };
  });
  if(difLV.length) warn.push(difLV.length+' tiendas con leads/ventas del semáforo distintos al detalle por canal: '+difLV.slice(0,8).join(', ')+(difLV.length>8?'…':'')+'.');
  var meta = { corte: srcLabel(src), mes: src.mes, dias: src.dias, tcn_oct: src.tcn, tcn_hist: src.tcnh, prev: prev,
    prevLbl: prev.length ? prev[0].slice(0,3)+'–'+prev[prev.length-1].slice(0,3) : '', tcn_acum: tcnAcum, min_leads_regreso: BASE.min_leads_regreso,
    tot_leads: rows.reduce(function(a,r){return a+r.l;},0), tot_ventas: rows.reduce(function(a,r){return a+r.v;},0), warn: warn };
  return {meta:meta, rows:rows};
}
var REG_ORDER = ['BAJIO','CENTRO','NOROESTE 1','NORTE 1','NORTE 2','PACIFICO','SUR PENINSULA'];
var REG_LBL = {'BAJIO':'Bajío','CENTRO':'Centro','NOROESTE 1':'Noroeste 1','NORTE 1':'Norte 1','NORTE 2':'Norte 2','PACIFICO':'Pacífico','SUR PENINSULA':'Sur Península'};

function title(s){return String(s||'').toLowerCase().replace(/(^|[\s\-])([a-záéíóúñü])/g,function(m,a,b){return a+b.toUpperCase();});}

function decorate(rows){ rows.forEach(function(r){
  r.key = r.cie ? 'cierre' : (r.st==='campania' ? r.sem : r.st);
  r.regx = r.reg && !r.cie;              // una tienda que cierra no regresa a campaña
  r.notes = [];
  if(r.cie) r.notes.push('cierre');
  if(r.st==='campania') r.notes.push('camp');
  if(r.sale) r.notes.push('sale');
  if(r.cap) r.notes.push('cap');
  if(r.bg) r.notes.push('bg');
  if(r.regx) r.notes.push('reg');
  if(r.regx && r.rv) r.notes.push('rv');
  if(r.st==='sin2026') r.notes.push('sin');
  if(r.st==='fuera' && !r.regx && !r.cie) r.notes.push('fuera');
  // prioridad de atención: primero lo que requiere acción
  r.pri = r.cie ? 9 : r.sale ? 0 : r.key==='rojo' ? 1 : r.cap ? 2 : r.bg ? 3 : r.key==='amarillo' ? 4 : r.key==='verde' ? 5 : r.regx ? 6 : r.key==='fuera' ? 7 : 8;
  r.tcv = r.l ? r.tc : -1;
  r.tchv = r.tch==null ? -1 : r.tch;
}); }

var ST_OPTS = [['','Todos'],['verde','Verde'],['amarillo','Amarillo'],['rojo','Rojo'],['fuera','Salieron de campaña 2026'],['sin2026','Sin campaña 2026'],['cierre','Cierre']];

/* ---------- agregados ---------- */
function agg(rs){
  var a={n:rs.length,camp:0,l:0,v:0,rojo:0,amar:0,verde:0,cap:0,bg:0,sale:0,reg:0,cie:0,sin:0,fuera:0};
  rs.forEach(function(r){
    a.l+=r.l; a.v+=r.v;
    if(r.st==='campania'){a.camp++; if(r.sem==='rojo')a.rojo++; else if(r.sem==='amarillo')a.amar++; else a.verde++;}
    if(r.cap)a.cap++; if(r.bg)a.bg++; if(r.sale)a.sale++; if(r.regx)a.reg++; if(r.cie)a.cie++;
    if(r.st==='sin2026')a.sin++; if(r.st==='fuera')a.fuera++;
  });
  a.tc = a.l ? a.v/a.l*100 : null;
  return a;
}

var LS_KEY = 'ventas_mkt_dig_retro_v1';
var Store = { mode:'local', items:[], db:null, dl:null, listeners:[] };
function lsRead(){ try{ var x=JSON.parse(localStorage.getItem(LS_KEY)||'[]'); return Array.isArray(x)?x:[]; }catch(e){ return []; } }
function lsWrite(a){ try{ localStorage.setItem(LS_KEY, JSON.stringify(a)); return true; }catch(e){ return false; } }
Store.items = lsRead();
function notify(){ Store.listeners.forEach(function(fn){ fn(); }); }
function newId(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
Store.add = function(c){
  c.id = c.id || newId();
  if(Store.mode==='db') return Store.db.collection('retro').doc(c.id).set(c);
  var a = lsRead(); a.push(c);
  if(!lsWrite(a)) return Promise.reject(new Error('El navegador no permitió guardar. Exporta el comentario antes de cerrar.'));
  Store.items = a; notify(); return Promise.resolve();
};
Store.remove = function(id){
  if(Store.mode==='db') return Store.db.collection('retro').doc(id).delete();
  var a = lsRead().filter(function(x){return x.id!==id;}); lsWrite(a); Store.items=a; notify(); return Promise.resolve();
};
function connectDb(){
  if(!window.claude || typeof window.claude.use!=='function') return;
  window.claude.use('db').then(function(db){
    if(!db) return;
    Store.db = db;
    db.doc('fuente/rosters').onSnapshot(function(d){
      var x = (d.exists && d.data()) || {}, ch = false;
      var faltan = Object.keys(Fuente.rosters).filter(function(m){ return !Array.isArray(x[m]); });
      if(faltan.length) db.doc('fuente/rosters').set(Object.assign({}, Fuente.rosters, x)).catch(function(){});
      Object.keys(x).forEach(function(m){ if(Array.isArray(x[m]) && JSON.stringify(Fuente.rosters[m])!==JSON.stringify(x[m])){ Fuente.rosters[m]=x[m]; ch=true; } });
      if(ch){ try{ localStorage.setItem(ROS_LS, JSON.stringify(Fuente.rosters)); }catch(e){} if(Fuente.src) renderAll(buildData(Fuente.src, Fuente.rosters), Fuente.origen); }
    }, function(){});
    db.doc('fuente/actual').onSnapshot(function(d){
      if(!d.exists) return; var x = d.data()||{};
      try{ var src = JSON.parse(x.json); if(validSrc(src) && srcRank(src) > srcRank(Fuente.src)) useSource(src, {txt: srcLabel(src)+', compartido en el tablero', live:false}); }catch(e){}
    }, function(){});
    db.collection('retro').onSnapshot(function(snap){
      Store.mode = 'db';
      Store.items = snap.docs.map(function(d){ var x=d.data()||{}; return Object.assign({}, x, {id:d.id}); });
      notify();
    }, function(err){
      Store.mode = 'local'; Store.items = lsRead(); notify();
      setAllMsg('No se pudo leer la base compartida ('+(err&&err.code||'error')+'). Se usa este navegador.', true);
    });
  }).catch(function(){});
  window.claude.use('downloads').then(function(dl){ Store.dl = dl || null; }).catch(function(){});
}

function numTest(expr, v){
  if(!expr) return true;
  var e = expr.replace(',', '.').replace('%','').replace(/\s/g,'');
  var m;
  if((m = e.match(/^(-?\d+(?:\.\d+)?)-(-?\d+(?:\.\d+)?)$/))) return v>=+m[1] && v<=+m[2];
  if((m = e.match(/^(>=|<=|>|<|=)?(-?\d+(?:\.\d+)?)$/))){
    var n=+m[2];
    switch(m[1]){case '>':return v>n;case '<':return v<n;case '>=':return v>=n;case '<=':return v<=n;default:return v===n;}
  }
  return true; // expresión incompleta: no filtra
}
var KEY_ORDER = {rojo:0,amarillo:1,verde:2,fuera:3,sin2026:4,cierre:5};
function sortVal(r,k){
  if(k==='t') return r.t;

  if(k==='notes') return r.pri;

}
function passes(T, r){
  var f=T.f, q=QUICK[T.rg];
  if(q){ var p=q.split(':'); if(p[0]==='k' && r.key!==p[1]) return false; if(p[0]==='n' && r.notes.indexOf(p[1])<0) return false; }
  if(f.t){ var s=f.t.toLowerCase(); if((r.t+' '+r.k+' '+(r.sel||'')).toLowerCase().indexOf(s)<0) return false; }
  if(f.q){ var pq=f.q.split(':'); if(pq[0]==='k' && r.key!==pq[1]) return false; if(pq[0]==='n' && r.notes.indexOf(pq[1])<0) return false; }
  if(f.tcv && (!r.l || !numTest(f.tcv, r.tc))) return false;
  if(f.tchv && (r.tch==null || !numTest(f.tchv, r.tch))) return false;
  return true;
}
function render(T){
  var k=T.sort.k, d=T.sort.dir;
  var rs = T.rows.filter(function(r){return passes(T,r);}).sort(function(a,b){
    var x=sortVal(a,k), y=sortVal(b,k), c;
    if(typeof x==='string') c = x.localeCompare(y,'es'); else c = x-y;
    if(c===0 && k!=='pri') c = a.pri-b.pri;
    if(c===0) c = a.tcv-b.tcv || a.t.localeCompare(b.t,'es');
    return c*(k==='pri'?1:d);
  });
  T.el.querySelectorAll('th.s').forEach(function(h){
    var on = h.dataset.k===k;
    h.querySelector('.ar').textContent = on ? (d>0?'▲':'▼') : '';
    h.setAttribute('aria-sort', on ? (d>0?'ascending':'descending') : 'none');
  });
  T.el.querySelector('tbody').innerHTML = rs.map(rowHtml).join('');
  T.el.querySelector('.empty').hidden = rs.length>0;
  var q = QUICK[T.rg], cnt = T.el.querySelector('.cnt'), filtered = !!q || Object.keys(T.f).some(function(k){return T.f[k];});
  cnt.hidden = !filtered; cnt.textContent = filtered ? rs.length+' de '+T.rows.length+' tiendas con el filtro' : '';
}

var CRC_T = (function(){ var t=new Uint32Array(256); for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c = (c&1) ? (0xEDB88320^(c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();

function zipBytes(files){

  files.forEach(function(f){
    var nm=utf8(f.name), data=utf8(f.data), crc=crc32(data);

function buildDocx(items, scopeLabel){

function importJson(box, file){
  if(!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    var data; try{ data = JSON.parse(fr.result); }catch(e){ msg(box,'El archivo no es un respaldo válido.',true); return; }
    var list = Array.isArray(data) ? data : (data && data.comentarios);
    if(!Array.isArray(list)){ msg(box,'El archivo no trae comentarios.',true); return; }

    var nuevos = list.filter(function(x){ return x && x.id && x.texto && x.region && !have[x.id]; });

  };

}
